<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【ホロドリ】ポッピンロープ イベントポイント調整ツール</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; }
  .calc { max-width: 520px; margin: 0 auto; }
  .lang { text-align: right; }
  .lang select { font-size: 1em; padding: 4px; }
  label { display: block; margin-top: 8px; font-weight: bold; }
  input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; font-size: 1em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { margin-top: 16px; width: 100%; padding: 12px; font-size: 1.1em; }
  .errors { color: #c00; padding-left: 20px; }
  .usage { background: #f5f5f5; border-radius: 8px; padding: 4px 12px 8px; font-size: 0.9em; color: #222; }
  .usage h3 { margin: 8px 0 4px; }
  .usage ol { margin: 0; padding-left: 20px; }
  .usage li { margin-bottom: 6px; }
  .result-box { border: 1px solid #999; border-radius: 8px; padding: 8px 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="calc">
  <div class="lang">
    <select id="lang" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>

  <h2 data-i18n="title"></h2>

  <div class="usage">
    <h3 data-i18n="usageTitle"></h3>
    <ol>
      <li data-i18n="usage1"></li>
      <li data-i18n="usage2"></li>
      <li data-i18n="usage3"></li>
    </ol>
  </div>

  <label for="current" data-i18n="current"></label>
  <input type="text" id="current" inputmode="numeric">
  <label for="target" data-i18n="target"></label>
  <input type="text" id="target" inputmode="numeric">

  <h3 data-i18n="pointsHeading"></h3>
  <div class="grid" id="pointsGrid"></div>

  <button id="run" data-i18n="run"></button>
  <ul class="errors" id="errors"></ul>
  <div id="results"></div>
</div>

<script>
// 倍率 => ブースト消費数
const BOOSTS = [[1,0],[6,15],[12,30],[17,45],[22,60],[26,75],[30,90]];
const MAX_DIFF = 200000;

// ===== 多言語テキスト =====
const I18N = {
  ja: {
    title: 'ポッピンロープ ポイント調整ツール',
    pageTitle: '【ホロドリ】ポッピンロープ イベントポイント調整ツール',
    usageTitle: '利用方法',
    usage1: '目標ポイントと現在ポイントの偶奇を揃えてください。目標ポイントまで20万ポイント以内に調整してください。(ライブブースト0炊きで任意の楽曲をプレイし揃えるのがオススメです。推奨ポイント差は1~3万ポイントです。差が小さすぎると調整不可能な場合があります。)',
    usage2: 'ミニゲームブーストを0に設定し、ポッピンロープを1~10回ジャンプした際のイベントポイント増加量を入力してください。(実際にプレイしてください)',
    usage3: '計算実行ボタンを押してください。最短プレイ回数と、最小ブースト消費数が表示されます。',
    current: '現在ポイント',
    target: '目標ポイント',
    pointsHeading: 'ジャンプ回数ごとの獲得ポイント(1倍時)',
    jumpLabel: n => `${n}回`,
    run: '計算実行',
    needed: '必要ポイント',
    resMinPlays: '最短プレイ回数',
    resMinBoost: '最小ブースト消費数',
    notFound: 'ちょうどの組み合わせが見つかりませんでした。',
    playsLabel: 'プレイ回数',
    playsValue: n => `${n}回`,
    boostLabel: 'ブースト消費',
    step: (jump, mult, count, pts) => `${jump}回ジャンプ × ${mult}倍 を ${count}回(+${pts})`,
    errJump: i => `${i}回ジャンプのポイントは0以上の整数で入力してください。`,
    errCurrent: '現在ポイントは0以上の整数で入力してください。',
    errTarget: '目標ポイントは0以上の整数で入力してください。',
    errOrder: '目標ポイントは現在ポイントより大きくしてください。',
    errNoPoints: 'ジャンプ時のポイントを1つ以上入力してください。',
    errTooBig: max => `差分が大きすぎます(上限${max})。`
  },
  en: {
    title: 'Popping Rope Point Adjustment Tool',
    pageTitle: '[Holodori] Popping Rope Event Point Adjustment Tool',
    usageTitle: 'How to use',
    usage1: 'Make the current points and the target points both even or both odd (same parity), and keep the gap within 200,000 points. (Tip: play any song with Live Boost set to 0 to line them up. The recommended gap is 10,000–30,000 points. If the gap is too small, adjustment may be impossible.)',
    usage2: 'Set Mini-game Boost to 0, then play Popping Rope and enter the event points gained for 1 to 10 jumps. (Please actually play to measure them.)',
    usage3: 'Press the Calculate button. The fewest plays and the lowest boost cost will be shown.',
    current: 'Current points',
    target: 'Target points',
    pointsHeading: 'Points per jump count (at 1x)',
    jumpLabel: n => (n === 1 ? '1 jump' : `${n} jumps`),
    run: 'Calculate',
    needed: 'Points needed',
    resMinPlays: 'Fewest plays',
    resMinBoost: 'Lowest boost cost',
    notFound: 'No exact combination was found.',
    playsLabel: 'Plays',
    playsValue: n => `${n}`,
    boostLabel: 'Boost cost',
    step: (jump, mult, count, pts) =>
      `${jump} ${jump === 1 ? 'jump' : 'jumps'} @ ${mult}x — ${count} ${count === 1 ? 'time' : 'times'} (+${pts})`,
    errJump: i => `Enter a whole number (0 or more) for ${i} ${i === 1 ? 'jump' : 'jumps'}.`,
    errCurrent: 'Enter the current points as a whole number (0 or more).',
    errTarget: 'Enter the target points as a whole number (0 or more).',
    errOrder: 'Target points must be greater than current points.',
    errNoPoints: 'Enter at least one jump point value greater than 0.',
    errTooBig: max => `The gap is too large (max ${max}).`
  }
};

// 初期言語はブラウザ設定から判定(保存はしない)
let lang = (navigator.language || 'ja').toLowerCase().startsWith('ja') ? 'ja' : 'en';
// 直近の計算状態(言語切替時に再描画するため保持)
let state = { errors: [], results: null };

// 入力欄を生成
const grid = document.getElementById('pointsGrid');
for (let i = 1; i <= 10; i++) {
  const div = document.createElement('div');
  div.innerHTML = `<label for="p${i}" id="lbl${i}"></label><input type="text" id="p${i}" inputmode="numeric">`;
  grid.appendChild(div);
}

function t(key, ...args) {
  const v = I18N[lang][key];
  return typeof v === 'function' ? v(...args) : v;
}

function toInt(v) {
  // 全角数字・全角カンマを半角に変換
  v = String(v).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  v = v.replace(/[,，]/g, '').trim();
  return /^\d+$/.test(v) ? parseInt(v, 10) : null;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 同じ獲得ポイントなら消費ブーストが最小のものだけ残す
function buildOptions(points) {
  const byGain = new Map();
  points.forEach((p, idx) => {
    if (p <= 0) return;
    for (const [mult, cost] of BOOSTS) {
      const gain = p * mult;
      const cur = byGain.get(gain);
      if (!cur || cost < cur.cost) byGain.set(gain, { jump: idx + 1, mult, gain, cost });
    }
  });
  return [...byGain.values()];
}

// mode: 'plays' = プレイ回数最小(同数ならブースト最小) / 'boost' = ブースト最小(同数ならプレイ回数最小)
function solve(diff, options, mode) {
  const INF = Infinity;
  const primary = new Array(diff + 1).fill(INF);
  const secondary = new Array(diff + 1).fill(INF);
  const choice = new Array(diff + 1).fill(-1);
  primary[0] = 0; secondary[0] = 0;

  for (let d = 1; d <= diff; d++) {
    for (let i = 0; i < options.length; i++) {
      const o = options[i];
      if (o.gain > d) continue;
      const prev = d - o.gain;
      if (primary[prev] === INF) continue;
      const np = primary[prev] + (mode === 'plays' ? 1 : o.cost);
      const ns = secondary[prev] + (mode === 'plays' ? o.cost : 1);
      if (np < primary[d] || (np === primary[d] && ns < secondary[d])) {
        primary[d] = np; secondary[d] = ns; choice[d] = i;
      }
    }
  }
  if (primary[diff] === INF) return null;

  const counts = new Map();
  for (let d = diff; d > 0; d -= options[choice[d]].gain) {
    const i = choice[d];
    counts.set(i, (counts.get(i) || 0) + 1);
  }
  let plays = 0, boost = 0;
  const steps = [];
  for (const [i, n] of counts) {
    const o = options[i];
    steps.push({ ...o, count: n });
    plays += n; boost += n * o.cost;
  }
  steps.sort((a, b) => b.gain - a.gain);
  return { plays, boost, steps };
}

function renderResult(label, r) {
  if (!r) return `<div class="result-box"><h3>${esc(label)}</h3><p>${esc(t('notFound'))}</p></div>`;
  const items = r.steps.map(s =>
    `<li>${esc(t('step', s.jump, s.mult, s.count, (s.gain * s.count).toLocaleString()))}</li>`).join('');
  return `<div class="result-box"><h3>${esc(label)}</h3>
    <p>${esc(t('playsLabel'))}: <strong>${esc(t('playsValue', r.plays.toLocaleString()))}</strong> / ${esc(t('boostLabel'))}: <strong>${r.boost.toLocaleString()}</strong></p>
    <ul>${items}</ul></div>`;
}

// 現在の状態と言語から画面を描画
function renderState() {
  document.getElementById('errors').innerHTML =
    state.errors.map(e => `<li>${esc(t(e[0], ...e.slice(1)))}</li>`).join('');
  const out = document.getElementById('results');
  const r = state.results;
  if (!r) { out.innerHTML = ''; return; }
  out.innerHTML = `<p>${esc(t('needed'))}: ${r.diff.toLocaleString()}</p>`
    + renderResult(t('resMinPlays'), r.plays)
    + renderResult(t('resMinBoost'), r.boost);
}

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  for (let i = 1; i <= 10; i++) document.getElementById('lbl' + i).textContent = t('jumpLabel', i);
  document.getElementById('lang').value = lang;
  renderState();
}

document.getElementById('lang').addEventListener('change', e => {
  lang = e.target.value;
  applyLang();
});

document.getElementById('run').addEventListener('click', () => {
  const errors = [];
  const current = toInt(document.getElementById('current').value);
  const target = toInt(document.getElementById('target').value);
  const points = [];
  for (let i = 1; i <= 10; i++) {
    const p = toInt(document.getElementById('p' + i).value);
    if (p === null) errors.push(['errJump', i]);
    points.push(p);
  }
  if (current === null) errors.push(['errCurrent']);
  if (target === null) errors.push(['errTarget']);
  if (current !== null && target !== null && target <= current) errors.push(['errOrder']);
  if (!errors.length && Math.max(...points) <= 0) errors.push(['errNoPoints']);
  if (!errors.length && target - current > MAX_DIFF) errors.push(['errTooBig', MAX_DIFF.toLocaleString()]);

  if (errors.length) {
    state = { errors, results: null };
  } else {
    const diff = target - current;
    const options = buildOptions(points);
    state = {
      errors: [],
      results: { diff, plays: solve(diff, options, 'plays'), boost: solve(diff, options, 'boost') }
    };
  }
  renderState();
});

applyLang();
</script>
</body>
</html>
